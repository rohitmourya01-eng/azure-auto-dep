apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auto-deployment
  labels:
    app.kubernetes.io/name: auto-deployment
    app.kubernetes.io/part-of: auto-deployment-project
    kubernetes.azure.com/generator: devhub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auto-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80